steps:
  # 1. Build the container image passing HF_TOKEN and MODEL_NAME as build args
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg HF_TOKEN=$$HF_TOKEN \
          --build-arg MODEL_ID=${_MODEL_NAME} \
          -t ${_IMAGE_URL} .
    secretEnv: ['HF_TOKEN']

  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_URL}']

  # 3. Deploy the Cloud Run Service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'beta'
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_IMAGE_URL}'
      - '--region=${_REGION}'
      - '--service-account=${_BACKEND_SA_EMAIL}'
      - '--gpu=1'
      - '--gpu-type=${_GPU_TYPE}'
      - '--cpu=20'
      - '--memory=80Gi'
      - '--no-gpu-zonal-redundancy'
      - '--min-instances=1'
      - '--cpu-boost'
      - '--ingress=all'
      - '--no-allow-unauthenticated'
      - '--timeout=900'
      - '--add-volume=name=gcs-models-volume,type=cloud-storage,bucket=${_MODELS_BUCKET_NAME}'
      - '--add-volume-mount=volume=gcs-models-volume,mount-path=/mnt/models'
      - '--set-env-vars=PROJECT_ID=${PROJECT_ID},ADAPTER_DIR=${_ADAPTER_DIR},LORA_MODULE_NAME=${_SERVICE_NAME},VPC_NAME=${_VPC_NAME},SUBNET_NAME=${_SUBNET_NAME}'

substitutions:
  _REGION: us-central1
  _IMAGE_URL: ''
  _SERVICE_NAME: gemma-4-sare-tuned
  _MODELS_BUCKET_NAME: ''
  _BACKEND_SA_EMAIL: ''
  _MODEL_NAME: 'google/gemma-4-12b-it'
  _VPC_NAME: 'sare-vpc'
  _SUBNET_NAME: 'sare-subnet'
  _ADAPTER_DIR: '/mnt/models/sare-agroforestry'
  _GPU_TYPE: 'nvidia-rtx-pro-6000'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/HF_TOKEN/versions/latest
      env: 'HF_TOKEN'

timeout: 3600s

options:
  machineType: 'E2_HIGHCPU_32'
  diskSizeGb: '500'
  logging: CLOUD_LOGGING_ONLY
