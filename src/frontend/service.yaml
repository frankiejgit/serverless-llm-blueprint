apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  annotations:
    run.googleapis.com/launch-stage: BETA
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/network-interfaces: '[{"network":"${VPC_NAME}","subnetwork":"${SUBNET_NAME}"}]'
        run.googleapis.com/vpc-access-egress: private-ranges-only
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: ${FRONTEND_SA_EMAIL}
      containers:
      # --- 1. OPENWEBUI (Primary Ingress Container) ---
      - name: openwebui
        image: ${OPENWEBUI_IMAGE_URL}
        env:
        - name: OPENAI_API_BASE_URL
          value: "http://localhost:8000/v1"
        - name: OPENAI_API_BASE_URLS
          value: "http://localhost:8000/v1"
        - name: OPENAI_API_KEY
          value: "no-key-required"
        - name: OPENAI_API_KEYS
          value: "no-key-required"
        - name: ENABLE_OLLAMA_API
          value: "False"
        - name: WEBUI_SECRET_KEY
          value: "${WEBUI_SECRET_KEY}"
        - name: WEBUI_AUTH
          value: "False"
        - name: WEBUI_AUTH_TRUSTED_EMAIL_HEADER
          value: "X-Goog-Authenticated-User-Email"
        - name: WEBUI_NAME
          value: "${WEBUI_NAME}"
        - name: ENABLE_SIGNUP
          value: "False"
        resources:
          limits:
            cpu: "4000m"
            memory: "8Gi"
        ports:
        - name: http1
          containerPort: 8080

      # --- 2. SMART AUTH PROXY (Sidecar Container) ---
      - name: auth-proxy
        image: ${PROXY_IMAGE_URL}
        env:
        - name: PORT
          value: "8000"
        - name: TUNED_MODEL_NAME
          value: "${TUNED_MODEL_NAME}"
        - name: BASE_MODEL_NAME
          value: "${BASE_MODEL_NAME}"
        - name: TUNED_MODEL_URL
          value: "${TUNED_MODEL_URL}"
        - name: BASE_MODEL_URL
          value: "${BASE_MODEL_URL}"
        resources:
          limits:
            cpu: "2000m"
            memory: "4Gi"
